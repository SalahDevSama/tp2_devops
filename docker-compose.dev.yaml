services:
  guestbook:
    build:
      context: .
      target: dev
    image: guestbook:dev
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
    volumes:
      - .:/app
    depends_on:
      - redis
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
